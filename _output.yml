bookdown::gitbook:
  css: style.css
  config:
    toc:
      before: |
        <li><a href="./">Modelo lineal generalizado</a></li>
      after: |
        <li><a href="https://github.com/rstudio/bookdown" target="blank">Published with bookdown</a></li>
    download: ["pdf"]
    split_by: none
    self_contained: true
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  citation_package: natbib
  keep_tex: yes
bookdown::epub_book: default